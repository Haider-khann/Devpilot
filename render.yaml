# Render service definition for the production backend.
services:
  - type: web
    name: devpilot
    env: python
    # Install dependencies from the backend requirements file.
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port 10000
    # Secrets are supplied through the Render dashboard, not committed here.
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.0
